<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Entrenamiento cognitivo web con figuras, colores, palabras y seguimiento de resultados." />
  <title>Entrenamiento cognitivo</title>
  
  <style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --text: #17212b;
  --muted: #5f6b76;
  --line: #d9e0e6;
  --accent: #1457d9;
  --accent-soft: #eaf1ff;
  --good: #177245;
  --good-soft: #e8f7ef;
  --bad: #b3261e;
  --bad-soft: #fdecea;
  --shadow: 0 12px 32px rgba(23,33,43,.08);
  --radius: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; }
button { touch-action: manipulation; }

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px clamp(14px, 3vw, 32px); background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
.brand { border: 0; background: transparent; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: clamp(17px, 2.2vw, 23px); color: var(--text); cursor: pointer; text-align: left; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
.main { width: min(1180px, calc(100% - 24px)); margin: 0 auto; flex: 1; padding: clamp(18px, 3vw, 38px) 0 48px; }
.footer { padding: 18px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); background: #fff; }

.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: clamp(22px, 5vw, 48px); }
.hero h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 54px); line-height: 1.03; }
.hero p { max-width: 800px; font-size: clamp(17px, 2vw, 21px); line-height: 1.55; color: var(--muted); margin: 0; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.section { margin-top: 24px; }
.section-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-title h2 { margin: 0; font-size: clamp(22px, 3vw, 30px); }
.section-title p { margin: 0; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 7px 20px rgba(23,33,43,.04); }
.exercise-card { min-height: 176px; display: flex; flex-direction: column; }
.exercise-card h3 { margin: 8px 0; font-size: 21px; }
.exercise-card p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; flex: 1; }
.badge { display: inline-flex; width: fit-content; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }

.btn { border: 0; border-radius: 13px; min-height: 46px; padding: 11px 16px; font-weight: 750; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { color: #fff; background: var(--accent); box-shadow: 0 8px 18px rgba(20,87,217,.22); }
.btn-secondary { color: var(--accent); background: var(--accent-soft); }
.btn-ghost { color: var(--text); background: #f5f7f9; border: 1px solid var(--line); }
.btn-danger { color: var(--bad); background: var(--bad-soft); }
.btn-large { min-height: 58px; padding-inline: 24px; font-size: 18px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.field { display: grid; gap: 7px; }
.field label { font-weight: 750; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; color: var(--text); }
.field textarea { min-height: 90px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 3px solid rgba(20,87,217,.15); border-color: var(--accent); }
.help { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

.test-header { display: grid; gap: 12px; margin-bottom: 18px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 750; }
.progress { height: 14px; border-radius: 999px; background: #e7ecf0; overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .25s ease; }
.instruction { margin: 0; font-size: clamp(21px, 3vw, 31px); line-height: 1.25; }
.test-board { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(14px, 4vw, 60px); align-items: start; }
.column { display: grid; gap: 12px; position: relative; z-index: 2; }
.column-title { margin: 0 0 2px; color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .07em; }
.match-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.match-line { stroke: var(--good); stroke-width: 4; stroke-linecap: round; opacity: .8; }

.match-card { min-height: 86px; width: 100%; border: 2px solid var(--line); border-radius: 17px; background: #fff; padding: 12px 14px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: clamp(18px, 2.5vw, 26px); font-weight: 800; text-align: center; user-select: none; touch-action: none; position: relative; box-shadow: 0 5px 14px rgba(23,33,43,.04); }
.match-card.source { cursor: grab; }
.match-card.target { cursor: pointer; }
.match-card.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 4px rgba(20,87,217,.12); }
.match-card.matched { border-color: #94d2b1; background: var(--good-soft); color: #0b5b36; }
.match-card.wrong { animation: shake .28s linear; border-color: #ef9a94; background: var(--bad-soft); }
.match-card .visual { min-width: 54px; min-height: 54px; display: grid; place-items: center; font-size: 42px; line-height: 1; }
.match-card .word { line-height: 1.2; }
.photo-visual { min-width: clamp(130px, 18vw, 205px) !important; min-height: clamp(110px, 15vw, 170px) !important; }
.stimulus-photo { display:block; width:clamp(130px, 18vw, 205px); height:clamp(110px, 15vw, 170px); object-fit:contain; border-radius:14px; background:#fff; }
.preview-box .stimulus-photo { width:min(230px, 65vw); height:180px; }

.color-swatch { width: 56px; height: 56px; border-radius: 13px; border: 2px solid rgba(0,0,0,.16); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.shape { width: 58px; height: 58px; display: block; }
.shape.circle { border-radius: 50%; }
.shape.square { border-radius: 7px; }
.shape.triangle { width: 0; height: 0; border-left: 32px solid transparent; border-right: 32px solid transparent; border-bottom: 58px solid currentColor; background: transparent !important; }
.shape.diamond { width: 48px; height: 48px; transform: rotate(45deg); border-radius: 5px; }
.shape.rectangle { width: 72px; height: 42px; border-radius: 5px; }

.drag-float { position: fixed; z-index: 1000; pointer-events: none; width: min(420px, 42vw); opacity: .93; transform: translate(-50%, -50%) scale(1.03); box-shadow: 0 18px 42px rgba(23,33,43,.22); }
body.dragging { cursor: grabbing; }
.drop-hover { outline: 4px solid rgba(20,87,217,.22); border-color: var(--accent) !important; }

.feedback { min-height: 36px; margin-top: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat { padding: 16px; border-radius: 16px; background: #f7f9fb; border: 1px solid var(--line); }
.stat strong { display: block; font-size: clamp(25px, 4vw, 42px); }
.stat span { color: var(--muted); font-size: 14px; }
.score-big { font-size: clamp(52px, 10vw, 104px); line-height: 1; font-weight: 900; color: var(--accent); margin: 10px 0 2px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: #f7f9fb; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
.small { font-size: 13px; color: var(--muted); }

.empty { text-align: center; padding: 36px 18px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 2000; background: #17212b; color: #fff; border-radius: 999px; padding: 11px 17px; transition: .2s ease; pointer-events: none; font-weight: 700; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.pill { border: 1px solid var(--line); background: #fff; padding: 9px 13px; border-radius: 999px; font-weight: 750; cursor: pointer; }
.pill.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.preview-box { min-height: 104px; display: grid; place-items: center; background: #f7f9fb; border: 1px dashed #bfc8d0; border-radius: 14px; padding: 12px; }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

@media (max-width: 860px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .topbar { align-items: flex-start; }
  .top-actions { max-width: 45%; }
}

@media (max-width: 640px) {
  .main { width: min(100% - 16px, 1180px); padding-top: 12px; }
  .topbar { padding: 10px; }
  .brand span:last-child { display: none; }
  .top-actions { max-width: none; }
  .btn { min-height: 48px; }
  .grid-2, .grid-3, .grid-4, .form-grid { grid-template-columns: 1fr; }
  .hero { padding: 22px 17px; border-radius: 20px; }
  .test-board { gap: 10px; }
  .match-card { min-height: 78px; padding: 10px 7px; font-size: 17px; }
  .match-card .visual { min-width: 44px; min-height: 44px; font-size: 36px; }
  .photo-visual { min-width: 112px !important; min-height: 96px !important; }
  .stimulus-photo { width:112px; height:96px; border-radius:12px; }
  .color-swatch { width: 46px; height: 46px; }
  .shape { transform: scale(.82); }
  .shape.diamond { transform: rotate(45deg) scale(.82); }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

.sync-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 6px 10px;
  border-radius: 999px;
  background: #eef2f5;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.sync-status::before { content: '●'; font-size: 10px; }
.sync-status.ok { background: var(--good-soft); color: var(--good); border-color: #b8ddc9; }
.sync-status.working { background: #fff7df; color: #806000; border-color: #ead391; }
.sync-status.bad { background: var(--bad-soft); color: var(--bad); border-color: #efb2ad; }
.local-info { display: flex; align-items: center; justify-content: space-between; }

@media (max-width: 640px) {
  .sync-status { font-size: 0; width: 34px; padding: 0; justify-content: center; }
  .sync-status::before { font-size: 13px; }
}


/* v2.2 - inicio simplificado y resultados gráficos */
.home-intro { display:flex; justify-content:space-between; align-items:center; gap:24px; padding: clamp(14px,2vw,22px) 4px 8px; }
.home-intro h1 { margin:5px 0 8px; font-size:clamp(32px,5vw,58px); line-height:1.04; }
.home-intro p { margin:0; color:var(--muted); font-size:clamp(17px,2vw,20px); }
.home-eyebrow { display:inline-block; font-weight:850; color:var(--accent); letter-spacing:.04em; text-transform:uppercase; font-size:13px; }
.home-results-button { min-width:220px; border:1px solid var(--line); background:#fff; border-radius:20px; padding:14px 18px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); cursor:pointer; text-align:left; }
.home-results-button:hover { border-color:#afc6f3; }
.home-results-button strong { display:block; font-size:18px; }
.home-results-button small { display:block; color:var(--muted); margin-top:2px; }
.home-results-icon { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; background:var(--accent-soft); color:var(--accent); font-size:24px; font-weight:900; }
.app-options-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.app-option-card { background:#fff; border:1px solid var(--line); border-radius:22px; padding:20px; display:grid; grid-template-columns:74px minmax(0,1fr) auto; gap:18px; align-items:center; box-shadow:0 8px 24px rgba(23,33,43,.05); }
.app-option-icon { width:74px; height:74px; border-radius:20px; display:grid; place-items:center; background:#f5f7fb; font-size:40px; }
.app-option-copy h3 { margin:3px 0 6px; font-size:23px; }
.app-option-copy p { margin:0; color:var(--muted); line-height:1.4; }
.app-option-kicker { color:var(--accent); font-weight:800; font-size:13px; }
.app-last-result { margin-top:10px; font-size:14px; }
.muted { color:var(--muted); }
.app-option-action { min-width:105px; }
.home-dashboard { margin-top:30px; }
.dashboard-grid { display:grid; grid-template-columns:1.35fr .85fr; gap:16px; }
.dashboard-summary h3,.dashboard-recent h3,.chart-heading h2 { margin:0 0 8px; }
.mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.mini-stats > div { padding:12px 14px; background:#f7f9fb; border:1px solid var(--line); border-radius:14px; }
.mini-stats strong { display:block; font-size:25px; }
.mini-stats span { color:var(--muted); font-size:13px; }
.recent-results-list { display:grid; gap:10px; margin-top:14px; }
.recent-result { display:grid; grid-template-columns:46px 1fr auto; gap:11px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.recent-result:last-child { border-bottom:0; }
.recent-result-icon { width:44px; height:44px; display:grid; place-items:center; background:#f4f6f8; border-radius:13px; font-size:24px; }
.recent-result-main strong { display:block; }
.recent-result-main span { display:block; color:var(--muted); font-size:13px; margin-top:3px; }
.score-pill { min-width:60px; text-align:center; padding:8px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:900; }
.result-chart-svg { width:100%; height:auto; min-height:150px; overflow:visible; }
.chart-grid line { stroke:#e5eaf0; stroke-width:1; }
.chart-axis-labels text { fill:#7c8793; font-size:11px; }
.chart-line { stroke:var(--accent); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.chart-points circle { fill:#fff; stroke:var(--accent); stroke-width:4; }
.chart-empty { min-height:140px; display:grid; place-items:center; color:var(--muted); background:#f8fafb; border:1px dashed var(--line); border-radius:14px; padding:16px; text-align:center; }
.compact-empty { min-height:auto; }
.results-hero { padding:clamp(20px,4vw,34px); }
.results-stat-grid { margin-top:18px; }
.results-charts-grid { display:grid; grid-template-columns:1.25fr .75fr; gap:16px; align-items:stretch; }
.chart-card { min-width:0; }
.chart-heading p { margin:0 0 18px; color:var(--muted); }
.result-bars { display:grid; gap:16px; margin-top:20px; }
.result-bar-row { display:grid; grid-template-columns:minmax(150px,1fr) minmax(130px,1.5fr) 54px; gap:12px; align-items:center; }
.result-bar-label strong,.result-bar-label span { display:block; }
.result-bar-label span { color:var(--muted); font-size:12px; margin-top:3px; }
.result-bar-track { height:14px; background:#edf1f5; border-radius:999px; overflow:hidden; }
.result-bar-track span { display:block; height:100%; border-radius:inherit; background:var(--accent); }
.result-bar-value { text-align:right; }

@media (max-width: 820px) {
  .home-intro { align-items:stretch; flex-direction:column; }
  .home-results-button { width:100%; }
  .app-options-grid,.dashboard-grid,.results-charts-grid { grid-template-columns:1fr; }
  .app-option-card { grid-template-columns:64px minmax(0,1fr); }
  .app-option-icon { width:64px; height:64px; font-size:34px; }
  .app-option-action { grid-column:1 / -1; width:100%; }
}
@media (max-width: 560px) {
  .app-option-card { grid-template-columns:54px minmax(0,1fr); padding:16px; gap:12px; }
  .app-option-icon { width:54px; height:54px; border-radius:16px; font-size:30px; }
  .mini-stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .mini-stats strong { font-size:21px; }
  .result-bar-row { grid-template-columns:1fr 48px; }
  .result-bar-track { grid-column:1 / -1; grid-row:2; }
}


/* v2.3 - version visible y estado de actualizaciones */
.home-version-panel { margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:14px 16px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 5px 18px rgba(23,33,43,.035); }
.home-version-main { display:grid; gap:3px; min-width:0; }
.home-version-label { color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.045em; }
.home-version-main strong { font-size:20px; }
.home-version-main strong span { color:var(--muted); font-size:15px; font-weight:750; }
.home-version-main small { color:var(--muted); font-size:13px; }
.home-version-panel.version-current { border-color:#b8ddc9; background:var(--good-soft); }
.home-version-panel.version-current .home-version-main small { color:var(--good); font-weight:750; }
.home-version-panel.version-update { border-color:#e2c35c; background:#fff8dc; }
.home-version-panel.version-update .home-version-main small { color:#725700; font-weight:800; }
.version-action { flex:0 0 auto; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
@media (max-width: 640px) {
  .home-version-panel { align-items:stretch; flex-direction:column; }
  .version-action { width:100%; }
}


/* v3.0 - autenticacion y administracion multiusuario */
.auth-gate { position:fixed; inset:0; z-index:5000; display:grid; place-items:center; padding:20px; background:rgba(244,246,248,.97); }
.auth-card { width:min(520px,100%); background:#fff; border:1px solid var(--line); border-radius:26px; padding:clamp(24px,5vw,42px); box-shadow:var(--shadow); text-align:center; }
.auth-card h1 { margin:10px 0; font-size:clamp(30px,5vw,46px); }
.auth-card p { color:var(--muted); line-height:1.55; }
.auth-google { width:100%; min-height:58px; font-size:18px; }
.user-chip { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; background:#fff; padding:5px 10px 5px 6px; font-weight:750; }
.user-chip img { width:30px; height:30px; border-radius:50%; object-fit:cover; }
.admin-kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:18px 0; }
.admin-kpi { background:#f7f9fb; border:1px solid var(--line); border-radius:16px; padding:16px; }
.admin-kpi strong { display:block; font-size:30px; }
.admin-kpi span { color:var(--muted); font-size:13px; }
.role-badge { display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:850; }
.role-badge.admin { background:#fff1d8; color:#7a5300; }
@media (max-width:640px){ .admin-kpis{grid-template-columns:1fr;} .user-chip span{display:none;} }

</style>

<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="brand" type="button" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">◉</span>
        <span>Entrenamiento cognitivo</span>
      </button>
      <div class="top-actions">
        <span id="syncStatus" class="sync-status" title="Estado de sincronización">Local</span>
        <button id="historyBtn" class="btn btn-ghost" type="button">Resultados</button>
        <button id="adminBtn" class="btn btn-ghost" type="button">Contenido</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <footer class="footer">
      <span>Herramienta de entrenamiento. No sustituye una valoración médica o neuropsicológica.</span>
    </footer>

function ensureBuiltinSets(content) {
  const safe = content && Array.isArray(content.sets) ? content : structuredClone(defaultContent);
  const existing = new Set(safe.sets.map(set => set.id));
  for (const builtIn of defaultContent.sets) {
    if (!existing.has(builtIn.id)) safe.sets.push(structuredClone(builtIn));
  }
  safe.version = Math.max(Number(safe.version || 1), 3);
  return safe;
}

  content: ensureBuiltinSets(loadJSON(STORAGE_CONTENT, defaultContent)),

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : structuredClone(fallback);
  } catch {
    return structuredClone(fallback);
  }
}

function setSyncStatus(text, kind = '') {
  if (!syncStatusEl) return;
  syncStatusEl.textContent = text;
  syncStatusEl.className = `sync-status ${kind}`.trim();
}

async function putServer(path, payload) {
  const response = await fetch(path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    cache: 'no-store'
  });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

function saveContent() {
  localStorage.setItem(STORAGE_CONTENT, JSON.stringify(state.content));
  if (!syncState.server) return;
  setSyncStatus('Guardando…', 'working');
  putServer('/api/content', state.content)
    .then(info => {
      syncState.contentVersion = info.version || syncState.contentVersion;
      setSyncStatus('Sincronizado', 'ok');
    })
    .catch(() => setSyncStatus('Sin conexión', 'bad'));
}

function saveResults() {
  localStorage.setItem(STORAGE_RESULTS, JSON.stringify(state.results));
  if (!syncState.server) return;
  putServer('/api/results', state.results)
    .then(info => { syncState.resultsVersion = info.version || syncState.resultsVersion; })
    .catch(() => setSyncStatus('Sin conexión', 'bad'));
}
function saveSettings() { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(state.settings)); }

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]));
}

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatDuration(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const min = Math.floor(total / 60);
  const sec = total % 60;
  return `${min}:${String(sec).padStart(2, '0')}`;
}

function formatDate(iso) {
  return new Intl.DateTimeFormat('es-ES', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(iso));
}

function safeImageSrc(value) {
  const raw = String(value || '').trim();
  if (raw.startsWith('data:image/')) return raw;
  try {
    const url = new URL(raw, location.href);
    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  } catch {}
  return '';
}

function safeLinkUrl(value) {
  const raw = String(value || '').trim();
  try {
    const url = new URL(raw, location.href);
    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  } catch {}
  return '';
}

function visualHTML(visual) {
  if (!visual) return '<span class="visual">?</span>';
  if (visual.type === 'emoji') return `<span class="visual" aria-hidden="true">${escapeHTML(visual.value)}</span>`;
  if (visual.type === 'color') return `<span class="visual"><span class="color-swatch" style="background:${escapeHTML(visual.value)}" aria-label="Muestra de color"></span></span>`;
  if (visual.type === 'shape') {
    const shape = escapeHTML(visual.shape || 'circle');
    const color = escapeHTML(visual.color || '#333333');
    if (shape === 'triangle') return `<span class="visual"><span class="shape triangle" style="color:${color}"></span></span>`;
    return `<span class="visual"><span class="shape ${shape}" style="background:${color}"></span></span>`;
  }
  if (visual.type === 'image' || visual.type === 'remote-image') {
    const src = safeImageSrc(visual.value);
    if (!src) return '<span class="visual" aria-label="Imagen no disponible">🖼️</span>';
    return `<span class="visual photo-visual"><img class="stimulus-photo" src="${escapeHTML(src)}" alt="${escapeHTML(visual.alt || 'Imagen')}" loading="lazy" referrerpolicy="no-referrer"></span>`;
  }
  if (visual.type === 'text') return `<span class="word">${escapeHTML(visual.value)}</span>`;
  return `<span class="visual">${escapeHTML(visual.value || '?')}</span>`;
}

function resultTrendSVG(results, compact = false) {
  const recent = [...results].slice(0, compact ? 8 : 12).reverse();
  if (!recent.length) return '<div class="chart-empty">Aún no hay sesiones para mostrar.</div>';
  const w = compact ? 640 : 760;
  const h = compact ? 180 : 250;
  const pad = compact ? 28 : 42;
  const plotW = w - pad * 2;
  const plotH = h - pad * 2;
  const x = i => recent.length === 1 ? w/2 : pad + (i * plotW / (recent.length - 1));
  const y = score => pad + ((100 - score) * plotH / 100);
  const points = recent.map((r,i) => `${x(i)},${y(r.score)}`).join(' ');
  const circles = recent.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.score)}" r="${compact ? 5 : 6}"><title>${escapeHTML(r.setName)}: ${r.score}% · ${escapeHTML(formatDate(r.date))}</title></circle>`).join('');
  const labels = compact ? '' : recent.map((r,i) => `<text x="${x(i)}" y="${h - 12}" text-anchor="middle">${new Date(r.date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</text>`).join('');
  return `<svg class="result-chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución de puntuación de los últimos tests">
    <g class="chart-grid">
      <line x1="${pad}" y1="${y(100)}" x2="${w-pad}" y2="${y(100)}"></line>
      <line x1="${pad}" y1="${y(75)}" x2="${w-pad}" y2="${y(75)}"></line>
      <line x1="${pad}" y1="${y(50)}" x2="${w-pad}" y2="${y(50)}"></line>
      <line x1="${pad}" y1="${y(25)}" x2="${w-pad}" y2="${y(25)}"></line>
      <line x1="${pad}" y1="${y(0)}" x2="${w-pad}" y2="${y(0)}"></line>
    </g>
    <g class="chart-axis-labels"><text x="6" y="${y(100)+4}">100%</text><text x="12" y="${y(50)+4}">50%</text><text x="22" y="${y(0)+4}">0%</text>${labels}</g>
    <polyline class="chart-line" points="${points}" fill="none"></polyline>
    <g class="chart-points">${circles}</g>
  </svg>`;
}

function resultByExerciseBars(results) {
  if (!results.length) return '<div class="chart-empty">Aún no hay resultados por ejercicio.</div>';
  const grouped = new Map();
  results.forEach(r => {
    const g = grouped.get(r.setName) || { sum: 0, count: 0, latest: r };
    g.sum += Number(r.score || 0); g.count += 1;
    if (new Date(r.date) > new Date(g.latest.date)) g.latest = r;
    grouped.set(r.setName, g);
  });
  return [...grouped.entries()].map(([name,g]) => {
    const avg = Math.round(g.sum/g.count);
    return `<div class="result-bar-row">
      <div class="result-bar-label"><strong>${escapeHTML(name)}</strong><span>${g.count} ${g.count === 1 ? 'test' : 'tests'} · último ${g.latest.score}%</span></div>
      <div class="result-bar-track" aria-label="Media ${avg}%"><span style="width:${avg}%"></span></div>
      <strong class="result-bar-value">${avg}%</strong>
    </div>`;
  }).join('');
}

function recentResultsHTML(results, limit = 4) {
  if (!results.length) return '<div class="empty compact-empty">Todavía no hay tests realizados.</div>';
  return results.slice(0, limit).map(r => `
    <article class="recent-result">
      <div class="recent-result-icon">${escapeHTML(state.content.sets.find(s=>s.id===r.setId)?.icon || '✓')}</div>
      <div class="recent-result-main"><strong>${escapeHTML(r.setName)}</strong><span>${escapeHTML(formatDate(r.date))} · ${formatDuration(r.durationMs)}</span></div>
      <div class="score-pill">${r.score}%</div>
    </article>`).join('');
}

function versionPanelHTML() {
  const info = syncState.versionInfo || {};
  const local = info.local || APP_FALLBACK_META;
  const version = escapeHTML(local.version || APP_FALLBACK_META.version);
  const date = escapeHTML(local.date || APP_FALLBACK_META.date);
  let statusClass = 'version-neutral';
  let statusText = 'Comprobando actualizaciones...';
  let action = '<button id="checkVersionBtn" class="btn btn-ghost version-action" type="button">Comprobar</button>';

  if (info.status === 'ok' && info.updateAvailable) {
    const remote = info.remote || {};
    statusClass = 'version-update';
    statusText = `Nueva versi\u00f3n v${escapeHTML(remote.version || '')} disponible${remote.date ? ` \u00b7 ${escapeHTML(remote.date)}` : ''}`;
    if (info.downloadUrl || info.releaseUrl) {
      action = `<a class="btn btn-primary version-action" href="${escapeHTML(info.downloadUrl || info.releaseUrl)}" target="_blank" rel="noopener">Ver actualizaci\u00f3n</a>`;
    }
  } else if (info.status === 'ok') {
    statusClass = 'version-current';
    statusText = 'Aplicaci\u00f3n actualizada';
  } else if (info.status === 'unavailable') {
    statusText = 'No se pudo comprobar GitHub. La aplicaci\u00f3n puede usarse con normalidad.';
  } else if (info.status === 'not_configured') {
    statusText = 'Canal de actualizaciones pendiente de configurar.';
  }

  return `<div class="home-version-panel ${statusClass}">
    <div class="home-version-main">
      <span class="home-version-label">Versi\u00f3n instalada</span>
      <strong>v${version} <span>\u00b7 ${date}</span></strong>
      <small>${statusText}</small>
    </div>
    ${action}
  </div>`;
}

function renderConfig(setId) {
  state.screen = 'config';
  const set = state.content.sets.find(s => s.id === setId);
  if (!set) return renderHome();
  state.selectedSetId = setId;
  const max = Math.min(20, set.pairs.length);
  const options = [5, 10, 15, 20].filter(n => n <= max);
  if (!options.includes(state.config.count)) state.config.count = options.at(-1) || max;

  main.innerHTML = `
    <section class="card">
      <span class="badge">${escapeHTML(set.icon || '◉')} ${escapeHTML(set.short || set.name)}</span>
      <h1 style="margin-bottom:8px">Configurar ejercicio</h1>
      <p style="color:var(--muted);margin-top:0">${escapeHTML(set.description)}</p>
      <div class="form-grid section">
        <div class="field">
          <label for="countSelect">Número total de elementos</label>
          <select id="countSelect">${options.map(n => `<option value="${n}" ${n === state.config.count ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <span class="help">Se muestran en grupos pequeños para no sobrecargar la pantalla.</span>
        </div>
        <div class="field">
          <label for="modeSelect">Forma de relacionar</label>
          <select id="modeSelect">
            <option value="link" ${state.config.mode === 'link' ? 'selected' : ''}>Relacionar pulsando</option>
            <option value="drag" ${state.config.mode === 'drag' ? 'selected' : ''}>Arrastrar y soltar</option>
          </select>
          <span class="help">En modo arrastrar también se permite pulsar como alternativa.</span>
        </div>
      </div>
      <div class="actions">
        <button id="beginBtn" class="btn btn-primary btn-large" type="button">Comenzar</button>
        <button id="cancelBtn" class="btn btn-ghost btn-large" type="button">Volver</button>
      </div>
    </section>`;

  document.getElementById('countSelect').addEventListener('change', e => state.config.count = Number(e.target.value));
  document.getElementById('modeSelect').addEventListener('change', e => state.config.mode = e.target.value);
  document.getElementById('cancelBtn').addEventListener('click', renderHome);
  document.getElementById('beginBtn').addEventListener('click', () => startSession(setId));
}

function startSession(setId) {
  const set = state.content.sets.find(s => s.id === setId);
  const count = Math.min(state.config.count, 20, set.pairs.length);
  const selected = shuffle(set.pairs).slice(0, count).map(p => structuredClone(p));
  state.session = {
    id: uid('session'), setId, setName: set.name, mode: state.config.mode,
    pairs: selected, total: selected.length, roundIndex: 0, roundSize: Math.min(state.settings.roundSize || 4, 5),
    matched: 0, wrongAttempts: 0, attemptsById: {}, firstTryCorrect: 0, startedAt: Date.now(), selectedSourceId: null,
    roundMatchedIds: new Set(), lines: []
  };
  renderRound();
}

function getRoundPairs() {
  const s = state.session;
  const start = s.roundIndex * s.roundSize;
  return s.pairs.slice(start, start + s.roundSize);
}

function renderRound() {
  state.screen = 'test';
  const s = state.session;
  if (!s) return renderHome();
  const roundPairs = getRoundPairs();
  if (!roundPairs.length) return finishSession();
  s.roundMatchedIds = new Set();
  s.selectedSourceId = null;
  s.lines = [];
  const targets = shuffle(roundPairs);
  const modeText = s.mode === 'drag' ? 'Arrastra cada elemento hasta su pareja. También puedes pulsar uno y después el otro.' : 'Pulsa un elemento de la izquierda y después su pareja de la derecha.';

  main.innerHTML = `
    <section class="test-header card">
      <div class="progress-row"><span>${escapeHTML(s.setName)}</span><span id="progressText">${s.matched} / ${s.total}</span></div>
      <div class="progress" aria-label="Progreso"><span id="progressBar" style="width:${(s.matched/s.total)*100}%"></span></div>
      <h1 class="instruction">Relaciona los elementos</h1>
      <p style="margin:0;color:var(--muted);font-size:17px">${escapeHTML(modeText)}</p>
    </section>
    <section class="card section">
      <div id="board" class="test-board">
        <svg id="matchSvg" class="match-svg" aria-hidden="true"></svg>
        <div class="column">
          <p class="column-title">Figuras</p>
          ${roundPairs.map(p => `<button class="match-card source" type="button" data-source="${escapeHTML(p.id)}" aria-label="Seleccionar elemento">${visualHTML(p.visual)}</button>`).join('')}
        </div>
        <div class="column">
          <p class="column-title">Palabras</p>
          ${targets.map(p => `<button class="match-card target" type="button" data-target="${escapeHTML(p.id)}"><span class="word">${escapeHTML(p.target)}</span></button>`).join('')}
        </div>
      </div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="actions" style="justify-content:center"><button id="quitBtn" class="btn btn-ghost" type="button">Finalizar sin guardar</button></div>
    </section>`;

  bindRoundInteractions();
  document.getElementById('quitBtn').addEventListener('click', renderHome);
  window.addEventListener('resize', drawLines, { once: true });
}

function bindRoundInteractions() {
  const s = state.session;
  const sources = [...main.querySelectorAll('[data-source]')];
  const targets = [...main.querySelectorAll('[data-target]')];

  sources.forEach(source => {
    source.addEventListener('click', e => {
      if (source.classList.contains('matched')) return;
      selectSource(source.dataset.source);
    });
    if (s.mode === 'drag') source.addEventListener('pointerdown', beginPointerDrag);
  });
  targets.forEach(target => target.addEventListener('click', () => {
    if (target.classList.contains('matched')) return;
    if (!s.selectedSourceId) {
      flashFeedback('Selecciona primero una figura.', false);
      return;
    }
    attemptMatch(s.selectedSourceId, target.dataset.target);
  }));
}

function selectSource(id) {
  const s = state.session;
  if (s.roundMatchedIds.has(id)) return;
  s.selectedSourceId = id;
  main.querySelectorAll('[data-source]').forEach(el => el.classList.toggle('selected', el.dataset.source === id));
  const el = main.querySelector(`[data-source="${cssEscape(id)}"]`);
  if (el) el.focus({ preventScroll: true });
}

function beginPointerDrag(event) {
  if (event.button !== undefined && event.button !== 0) return;
  const source = event.currentTarget;
  if (source.classList.contains('matched')) return;
  event.preventDefault();
  selectSource(source.dataset.source);
  const rect = source.getBoundingClientRect();
  const clone = source.cloneNode(true);
  clone.classList.add('drag-float');
  clone.style.width = `${rect.width}px`;
  document.body.appendChild(clone);
  document.body.classList.add('dragging');

  const pointerId = event.pointerId;
  source.setPointerCapture?.(pointerId);
  move(event);

  function move(e) {
    clone.style.left = `${e.clientX}px`;
    clone.style.top = `${e.clientY}px`;
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const target = under?.closest?.('[data-target]');
    if (target && !target.classList.contains('matched')) target.classList.add('drop-hover');
  }

  function end(e) {
    source.releasePointerCapture?.(pointerId);
    source.removeEventListener('pointermove', move);
    source.removeEventListener('pointerup', end);
    source.removeEventListener('pointercancel', end);
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const target = under?.closest?.('[data-target]');
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
    clone.remove();
    document.body.classList.remove('dragging');
    if (target && !target.classList.contains('matched')) attemptMatch(source.dataset.source, target.dataset.target);
  }

  source.addEventListener('pointermove', move);
  source.addEventListener('pointerup', end);
  source.addEventListener('pointercancel', end);
}

function attemptMatch(sourceId, targetId) {
  const s = state.session;
  if (!s || s.roundMatchedIds.has(sourceId)) return;
  s.attemptsById[sourceId] = (s.attemptsById[sourceId] || 0) + 1;

  const sourceEl = main.querySelector(`[data-source="${cssEscape(sourceId)}"]`);
  const targetEl = main.querySelector(`[data-target="${cssEscape(targetId)}"]`);

  if (sourceId === targetId) {
    if (s.attemptsById[sourceId] === 1) s.firstTryCorrect += 1;
    s.roundMatchedIds.add(sourceId);
    s.matched += 1;
    s.selectedSourceId = null;
    sourceEl?.classList.remove('selected');
    sourceEl?.classList.add('matched');
    targetEl?.classList.add('matched');
    sourceEl && (sourceEl.disabled = true);
    targetEl && (targetEl.disabled = true);
    s.lines.push({ sourceId, targetId });
    drawLines();
    updateProgress();
    flashFeedback('Correcto', true);

    if (s.roundMatchedIds.size === getRoundPairs().length) {
      setTimeout(() => {
        s.roundIndex += 1;
        if (s.matched >= s.total) finishSession(); else renderRound();
      }, 650);
    }
  } else {
    s.wrongAttempts += 1;
    sourceEl?.classList.add('wrong');
    targetEl?.classList.add('wrong');
    setTimeout(() => { sourceEl?.classList.remove('wrong'); targetEl?.classList.remove('wrong'); }, 350);
    flashFeedback('Prueba otra vez', false);
  }
}

function updateProgress() {
  const s = state.session;
  const text = document.getElementById('progressText');
  const bar = document.getElementById('progressBar');
  if (text) text.textContent = `${s.matched} / ${s.total}`;
  if (bar) bar.style.width = `${(s.matched / s.total) * 100}%`;
}

function flashFeedback(text, good) {
  const el = document.getElementById('feedback');
  if (!el) return;
  el.textContent = text;
  el.className = `feedback ${good ? 'good' : 'bad'}`;
  clearTimeout(flashFeedback._t);
  flashFeedback._t = setTimeout(() => { if (el) { el.textContent = ''; el.className = 'feedback'; } }, 900);
}

function drawLines() {
