name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Regression checks
        run: python3 scripts/check_regression.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployment date
        shell: bash
        run: |
          export STAMP="$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          node -e "const fs=require('fs');const p='v3-preview/version.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.date=process.env.STAMP;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n');"
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./v3-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
